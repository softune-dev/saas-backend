[pytest]
# asyncio_mode = auto  ->  no need to decorate every test with @pytest.mark.asyncio
asyncio_mode = auto

# Silences a pytest-asyncio deprecation warning. "function" matches the default
# test loop scope, which is what the _dispose_engine fixture in conftest.py
# assumes — read its docstring before changing this.
asyncio_default_fixture_loop_scope = function

testpaths = tests
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
